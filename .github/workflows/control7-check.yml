name: Control 7 check

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * *"

jobs:
  check-control-7:
    runs-on: ubuntu-latest
    steps:
      - name: Get the project files
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run the control 7 check
        run: python checks/control7_termination_access.py

      - name: Save the results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: control7-results
          path: results/
